name: Deploy Game Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            bash /root/bin/deploy-snipe-n-vibe.sh

      - name: Verify server is running
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export PATH="/root/.local/share/fnm/node-versions/v22.22.0/installation/bin:$PATH"
            echo "Checking pm2 status..."
            pm2 list | grep snipe-n-vibe

            echo "Waiting for WebSocket server..."
            for i in $(seq 1 10); do
              if ss -tlnp | grep -q ':8080'; then
                echo "Game server is listening on port 8080"
                exit 0
              fi
              echo "Attempt $i/10, waiting..."
              sleep 2
            done

            echo "Server failed to start"
            pm2 logs snipe-n-vibe --lines 20 --nostream
            exit 1
