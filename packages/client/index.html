<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DayZ Copy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      font-family: 'Courier New', monospace;
      color: #fff;
      z-index: 10;
    }
    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 20px; height: 20px;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.8);
    }
    #crosshair::before {
      top: 50%; left: 0; right: 0;
      height: 2px;
      transform: translateY(-50%);
    }
    #crosshair::after {
      left: 50%; top: 0; bottom: 0;
      width: 2px;
      transform: translateX(-50%);
    }
    #health-bar {
      position: absolute;
      bottom: 30px; left: 30px;
      width: 200px; height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }
    #health-fill {
      height: 100%;
      background: #4f4;
      border-radius: 4px;
      transition: width 0.2s;
    }
    #ammo-display {
      position: absolute;
      bottom: 30px; right: 30px;
      font-size: 24px;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }
    #ammo-display.low-ammo {
      color: #f44336;
    }
    #hit-marker {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      opacity: 0;
      transition: opacity 0.1s;
      color: #fff;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #hit-marker.show { opacity: 1; }
    #kill-confirmation {
      position: absolute;
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 20px rgba(255,255,255,0.3);
      opacity: 0;
      pointer-events: none;
      letter-spacing: 4px;
    }
    #kill-confirmation.show {
      animation: killFade 1.2s ease-out forwards;
    }
    #kill-confirmation.headshot {
      color: #ff2222;
      text-shadow: 0 0 10px rgba(255,50,50,0.8), 0 0 30px rgba(255,0,0,0.4);
      font-size: 42px;
    }
    @keyframes killFade {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    }
    #damage-vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      box-shadow: inset 0 0 100px rgba(255,0,0,0);
      transition: box-shadow 0.3s;
    }
    #damage-vignette.hurt {
      box-shadow: inset 0 0 100px rgba(255,0,0,0.4);
    }
    #kill-feed {
      position: absolute;
      top: 20px; right: 20px;
      font-size: 14px;
      text-align: right;
    }
    .kill-entry {
      margin-bottom: 4px;
      opacity: 0.8;
    }

    /* MW2-style Kill Counter */
    #kill-counter {
      position: absolute;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      color: #fff;
      text-shadow: 0 0 6px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.5);
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #kill-counter.visible {
      opacity: 1;
    }

    /* MW2-style XP Popup */
    #xp-popup {
      position: absolute;
      top: 48%; left: 50%;
      transform: translate(-50%, 0);
      font-size: 22px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      color: #FFD700;
      text-shadow: 0 0 8px rgba(255,215,0,0.6), 0 0 16px rgba(255,215,0,0.3);
      opacity: 0;
      pointer-events: none;
      letter-spacing: 1px;
    }
    #xp-popup.show {
      animation: xpFloat 1.2s ease-out forwards;
    }
    #xp-popup.headshot-xp {
      color: #FF4444;
      text-shadow: 0 0 8px rgba(255,68,68,0.8), 0 0 16px rgba(255,0,0,0.4);
      font-size: 26px;
    }
    @keyframes xpFloat {
      0% { opacity: 1; transform: translate(-50%, 0) scale(1.3); }
      20% { opacity: 1; transform: translate(-50%, -15px) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%, -50px) scale(0.8); }
    }

    /* MW2-style Streak Announcement */
    #streak-announcement {
      position: absolute;
      top: 30%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      color: #fff;
      text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(255,255,255,0.4), 0 0 80px rgba(255,200,0,0.3);
      opacity: 0;
      pointer-events: none;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    #streak-announcement.show {
      animation: streakIn 1.8s ease-out forwards;
    }
    @keyframes streakIn {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(2.0); }
      10% { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
      60% { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }

    /* Scoreboard */
    #scoreboard {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      align-items: center;
      justify-content: center;
      z-index: 50;
      pointer-events: none;
    }
    #scoreboard .scoreboard-inner {
      background: rgba(10, 12, 16, 0.88);
      border: 1px solid rgba(120, 140, 120, 0.35);
      border-radius: 4px;
      padding: 24px 32px 20px;
      min-width: 520px;
      max-width: 640px;
      width: 50%;
      box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.3);
    }
    .scoreboard-title {
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(180, 200, 180, 0.9);
      text-align: center;
      margin-bottom: 16px;
      text-shadow: 0 0 8px rgba(120, 160, 120, 0.3);
    }
    #scoreboard-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: rgba(220, 220, 220, 0.9);
    }
    #scoreboard-table thead th {
      color: rgba(140, 160, 140, 0.8);
      font-size: 11px;
      font-weight: normal;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-bottom: 1px solid rgba(120, 140, 120, 0.25);
      text-align: left;
    }
    #scoreboard-table thead th:first-child {
      width: 40px;
      text-align: center;
    }
    #scoreboard-table thead th:nth-child(3),
    #scoreboard-table thead th:nth-child(4),
    #scoreboard-table thead th:nth-child(5) {
      text-align: center;
      width: 70px;
    }
    #scoreboard-table tbody td {
      padding: 7px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    #scoreboard-table tbody td:first-child {
      text-align: center;
      color: rgba(160, 170, 160, 0.6);
    }
    #scoreboard-table tbody td:nth-child(3),
    #scoreboard-table tbody td:nth-child(4),
    #scoreboard-table tbody td:nth-child(5) {
      text-align: center;
    }
    #scoreboard-table tbody tr:hover {
      background: rgba(255,255,255,0.03);
    }
    #scoreboard-table tbody tr.scoreboard-local {
      background: rgba(100, 180, 100, 0.12);
      color: #fff;
    }
    #scoreboard-table tbody tr.scoreboard-local td {
      color: #fff;
      text-shadow: 0 0 6px rgba(120, 200, 120, 0.3);
    }
    #scoreboard-table tbody tr.scoreboard-local td:first-child {
      color: rgba(140, 220, 140, 0.9);
    }

    #start-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.92);
      color: #fff;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      z-index: 100;
      gap: 16px;
    }
    #start-screen .title {
      font-size: 56px;
      font-weight: bold;
      letter-spacing: 8px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255,255,255,0.3), 0 0 60px rgba(255,255,255,0.1);
    }
    #start-screen .subtitle {
      font-size: 22px;
      opacity: 0;
      transition: opacity 0.4s;
      animation: subtitlePulse 2s ease-in-out infinite;
    }
    #start-screen .subtitle.visible {
      opacity: 1;
    }
    #start-screen .controls-hint {
      font-size: 13px;
      opacity: 0;
      color: rgba(255,255,255,0.5);
      margin-top: 24px;
      letter-spacing: 1px;
      transition: opacity 0.4s;
    }
    #start-screen .controls-hint.visible {
      opacity: 1;
    }
    @keyframes subtitlePulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    #start-screen.connecting .subtitle {
      animation: none;
      opacity: 0.5;
    }

    /* Pause/resume overlay (shown when pointer lock is lost) */
    #pause-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-family: 'Courier New', monospace;
      font-size: 22px;
      cursor: pointer;
      z-index: 99;
      animation: subtitlePulse 2s ease-in-out infinite;
    }

    /* Scope overlay */
    #scope-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9;
      pointer-events: none;
    }
    #scope-overlay .scope-vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(
        circle at center,
        transparent 0%,
        transparent 32%,
        rgba(0,0,0,0.3) 36%,
        rgba(0,0,0,0.85) 40%,
        #000 42%
      );
    }
    #scope-overlay .scope-crosshair-h {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0,0,0,0.6);
      transform: translateY(-0.5px);
    }
    #scope-overlay .scope-crosshair-v {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(0,0,0,0.6);
      transform: translateX(-0.5px);
    }
    /* Fine center dot */
    #scope-overlay .scope-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 3px;
      background: rgba(255,0,0,0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    /* Mil-dot style tick marks */
    #scope-overlay .scope-ticks-h,
    #scope-overlay .scope-ticks-v {
      position: absolute;
    }
    #scope-overlay .scope-ticks-h {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 30px;
      height: 1px;
    }
    #scope-overlay .scope-ticks-v {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      width: 1px;
    }
    #scope-overlay .tick {
      width: 8px;
      height: 1px;
      background: rgba(0,0,0,0.7);
    }
    #scope-overlay .tick-v {
      width: 1px;
      height: 8px;
      background: rgba(0,0,0,0.7);
    }
    /* Scope ring border */
    #scope-overlay .scope-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 80vh;
      height: 80vh;
      border: 2px solid rgba(0,0,0,0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div id="start-screen" class="connecting">
    <div class="title">SNIPE-N-VIBE</div>
    <div class="subtitle">Connecting...</div>
    <div class="controls-hint">WASD Move | Right-Click Scope | Left-Click Shoot | Shift Hold Breath | Tab Scoreboard</div>
  </div>
  <div id="pause-overlay">Click to Resume</div>
  <div id="hud">
    <div id="crosshair"></div>
    <div id="health-bar"><div id="health-fill" style="width:100%"></div></div>
    <div id="ammo-display">5 / 5</div>
    <div id="hit-marker">X</div>
    <div id="kill-confirmation">ELIMINATED</div>
    <div id="kill-counter">0</div>
    <div id="xp-popup"></div>
    <div id="streak-announcement"></div>
    <div id="damage-vignette"></div>
    <div id="kill-feed"></div>
    <div id="death-screen" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(139,0,0,0.5);align-items:center;justify-content:center;flex-direction:column;">
      <div class="death-message" style="font-size:32px;color:#fff;">You died</div>
    </div>
  </div>
  <div id="scope-overlay">
    <div class="scope-vignette"></div>
    <div class="scope-ring"></div>
    <div class="scope-crosshair-h"></div>
    <div class="scope-crosshair-v"></div>
    <div class="scope-center"></div>
  </div>
  <div id="scoreboard" style="display:none;">
    <div class="scoreboard-inner">
      <div class="scoreboard-title">SCOREBOARD</div>
      <table id="scoreboard-table">
        <thead><tr>
          <th>#</th><th>Player</th><th>Kills</th><th>Deaths</th><th>K/D</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
